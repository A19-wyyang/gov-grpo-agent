algorithm:
  adv_estimator: grpo
  kl_ctrl:
    kl_coef: 0.03
reward:
  custom_reward_function:
    path: /data/code_repos/ywy/project/gov-grpo-agent/gov_grpo_agent/verl_reward.py
    name: compute_score
custom_reward_function:
  path: null
  name: null
reward_model:
  rollout: {}
  num_workers: null
  reward_manager: null
  reward_loop_source: null
  model:
    path: null
sandbox_fusion: {}
ray_kwargs:
  ray_init: {}
critic: null
distillation:
  enable: false
global_profiler:
  enable: false
nsys:
  enable: false
transfer_queue: null
shuffle: false
data:
  train_files: /data/code_repos/ywy/project/gov-grpo-agent/artifacts/verl_grpo_qwen3_8b/data/train.parquet
  val_files: /data/code_repos/ywy/project/gov-grpo-agent/artifacts/verl_grpo_qwen3_8b/data/train.parquet
  max_prompt_length: 2048
  max_response_length: 512
  train_batch_size: 64
actor_rollout_ref:
  model:
    path: Qwen/Qwen3-8B
    enable_gradient_checkpointing: true
  actor:
    optim:
      lr: 1.0e-06
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 1
    use_kl_loss: true
    kl_loss_coef: 0.03
  rollout:
    name: vllm
    'n': 4
    do_sample: true
    temperature: 1.0
    top_p: 0.9
    gpu_memory_utilization: 0.75
  ref:
    log_prob_micro_batch_size_per_gpu: 1
trainer:
  project_name: gov-grpo-agent
  experiment_name: qwen3_8b_grpo
  logger:
  - console
  default_local_dir: /data/code_repos/ywy/project/gov-grpo-agent/artifacts/verl_grpo_qwen3_8b/checkpoints
  total_epochs: 1
  save_freq: 10
  test_freq: 10
  nnodes: 1
  n_gpus_per_node: 8
