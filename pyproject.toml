[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gov-agent-rl"
version = "0.2.0"
description = "Reproducible government-service Agentic RL project with SFT, veRL GRPO, stateful tools, verifier rewards and evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6",
]

[project.optional-dependencies]
data = ["datasets>=2.19", "pyarrow>=15"]
judge = ["openai>=1.30"]
train = [
    "accelerate>=1.0",
    "datasets>=2.19",
    "numpy<2",
    "peft==0.19.1",
    "transformers==4.56.1",
]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
gov-agent-rl = "gov_agent_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
